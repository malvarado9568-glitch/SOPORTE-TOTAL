<h1>Reportar Nueva Incidencia</h1>

<p>Complete el siguiente formulario para registrar un incidente técnico.</p>

<div class="alerta-exito">
    Todos los reportes son revisados por el equipo de soporte técnico del Data Center.
</div>

<form action="#" method="post">

    <label>Nombre Completo</label>
    <input type="text" name="nombre" required>

    <label>Correo Electrónico</label>
    <input type="email" name="correo" required>

    <label>Prioridad</label>
    <select name="prioridad">
        <option>Baja</option>
        <option>Media</option>
        <option>Alta</option>
    </select>

    <label>Descripción del Problema</label>
    <textarea name="descripcion" placeholder="Describa el incidente reportado"></textarea>

    <button type="submit" class="btn">
        Enviar Reporte
    </button>

</form>


</body>
</html>
