<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidencia - Janela SmartFix</title>
</head>
<body>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar</a>
        <a href="tickets.html">Tickets</a>
    </nav>

    <main>
        <section>
            <h1>Reportar Nueva Incidencia</h1>
            <p>Completa el formulario para registrar tu problema técnico.</p>

            <form action="#" method="post">
                <label>Nombre completo:</label><br>
                <input type="text" name="nombre" required><br><br>

                <label>Correo electrónico:</label><br>
                <input type="email" name="correo" required><br><br>

                <label>Prioridad:</label><br>
                <input type="radio" name="prioridad" value="baja"> Baja
                <input type="radio" name="prioridad" value="media"> Media
                <input type="radio" name="prioridad" value="alta"> Alta<br><br>

                <label>Descripción del problema:</label><br>
                <textarea rows="5" cols="40" placeholder="Escribe tu problema aquí"></textarea><br><br>

                <input type="submit" value="Enviar Reporte">
            </form>
        </section>
    </main>

</body>
</html>
