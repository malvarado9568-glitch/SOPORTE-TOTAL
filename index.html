<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Kit Help Desk</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Design System - Help Desk</h1>

<!-- BOTONES -->

<div class="section">

<h2>Botones</h2>

<br>

<button class="btn btn-primary">
Botón Primario
</button>

<button class="btn btn-secondary">
Botón Secundario
</button>

<button class="btn btn-danger">
Botón Peligro
</button>

</div>

<!-- FORMULARIO -->

<div class="section">

<h2>Formulario</h2>

<br>

<form>

<label>Nombre</label>

<input type="text" placeholder="Ingrese su nombre">

<label>Correo</label>

<input type="email" placeholder="Ingrese correo">

<label>Prioridad</label>

<select>

<option>Baja</option>
<option>Media</option>
<option>Alta</option>

</select>

<label>Descripción</label>

<textarea rows="4"></textarea>

</form>

</div>

<!-- CARDS -->

<div class="section">

<h2>Cards</h2>

<br>

<div class="card">

<h3>Ticket #001</h3>

<p>
Fallo de conexión en laboratorio.
</p>

</div>

<div class="card">

<h3>Ticket #002</h3>

<p>
Servidor fuera de línea.
</p>

</div>

</div>

<!-- BADGES -->

<div class="section">

<h2>Prioridades</h2>

<br>

<span class="badge alta">
Alta
</span>

<span class="badge media">
Media
</span>

<span class="badge baja">
Baja
</span>

</div>

</div>

</body>
</html>
